
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0b1714">
<meta name="description" content="GymSaathi personal workout tracker">
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<title>GymSaathi - Workout Tracker</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;padding:18px;background:#0b1714;color:#f1f7f3;
 font-family:Arial,sans-serif;max-width:850px;margin:auto
}
h1{font-size:30px;margin-bottom:5px}
.sub{color:#a7b9af}
.panel{
 background:#13231e;border:1px solid #294239;
 padding:16px;border-radius:15px;margin:16px 0
}
label{display:block;color:#a7b9af;margin:12px 0 6px;font-size:13px}
input,select,textarea{
 width:100%;padding:12px;background:#0d1a15;color:white;
 border:1px solid #426451;border-radius:9px;font-size:15px
}
button{
 padding:12px 15px;border:0;border-radius:9px;
 background:#7de0a4;color:#092015;font-weight:bold;
 margin:5px 3px;cursor:pointer
}
.secondary{background:#254334;color:white}
.danger{background:#562c2c;color:white}
.primary{width:100%;padding:15px;font-size:16px;margin-top:15px}
.tabs{display:flex;gap:8px}
.tabs button{flex:1}
.active{background:#376b4b;color:white}
.exercise{
 background:#0e1b16;border:1px solid #294239;
 padding:13px;border-radius:12px;margin:12px 0
}
.set{
 display:grid;grid-template-columns:30px 1fr 1fr 35px;
 gap:6px;align-items:center;margin:8px 0
}
.set input{padding:10px;min-width:0}
.record{
 padding:13px;margin:10px 0;
 border:1px solid #294239;border-radius:10px
}
.record li{margin:8px 0}
.muted{color:#a7b9af;font-size:12px}
.hidden{display:none!important}
@media(max-width:450px){
 body{padding:12px}
 h1{font-size:26px}
 .panel{padding:12px}
}
</style>
</head>

<body>

<header>
<h1>🏋️ GymSaathi</h1>
<div class="sub">Your Personal Workout Tracker</div>
</header>

<div class="panel">
<div class="tabs">
<button id="logTab" class="active">Log Workout</button>
<button id="historyTab">History</button>
<button id="progressTab">Progress</button>
</div>
</div>

<section id="logSection">

<div class="panel">
<h2>Today's Workout</h2>

<label>Date</label>
<input type="date" id="workoutDate">

<label>Muscle Group</label>
<select id="muscle">
<option>Biceps</option>
<option>Triceps</option>
<option>Chest</option>
<option>Back</option>
<option>Shoulders</option>
<option>Legs</option>
<option>Abs</option>
<option>Full Body</option>
<option>Cardio</option>
<option>Other</option>
</select>

<label>Workout Title</label>
<input id="workoutTitle" placeholder="Example: Biceps Day">

<h3>Exercises</h3>
<div id="exerciseList"></div>

<button class="secondary" id="addExercise">+ Add Exercise</button>

<label>Workout Notes</label>
<textarea id="notes" rows="3" placeholder="How was today's workout?"></textarea>

<button class="primary" id="saveWorkout">SAVE WORKOUT</button>

<p class="muted">
Example: Dumbbell Curl - 7.5 kg × 12 reps.
Add each set separately.
</p>
</div>
</section>

<section id="historySection" class="hidden">
<div class="panel">
<h2>Workout History</h2>
<div id="historyList"></div>
</div>
</section>

<section id="progressSection" class="hidden">
<div class="panel">
<h2>Progress Tracker</h2>
<label>Exercise Name</label>
<input id="progressSearch" placeholder="Example: Dumbbell Curl">
<div id="progressResult" class="muted"></div>
</div>
<div class="panel">
<h3>Data Backup</h3>
<button id="backupButton">Download Backup</button>
<label>Restore Backup</label>
<input type="file" id="restoreFile" accept=".json">
</div>
</section>

<script>
"use strict";

const KEY = "gymsaathi_workouts_v3";

const $ = id => document.getElementById(id);

let workouts = [];
let exerciseCount = 0;

function todayDate(){
 const d = new Date();
 const month = String(d.getMonth()+1).padStart(2,"0");
 const day = String(d.getDate()).padStart(2,"0");
 return `${d.getFullYear()}-${month}-${day}`;
}

$("workoutDate").value = todayDate();

function loadData(){
 try{
  const saved = localStorage.getItem(KEY);
  workouts = saved ? JSON.parse(saved) : [];
  if(!Array.isArray(workouts)) workouts=[];
 }catch(e){
  workouts=[];
 }
}

function saveData(){
 try{
  localStorage.setItem(KEY,JSON.stringify(workouts));
  return true;
 }catch(e){
  alert("Storage error! Browser storage allow karein.");
  return false;
 }
}

function escapeHTML(value){
 return String(value ?? "").replace(/[&<>"']/g, char => ({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 })[char]);
}

function addSet(container){
 const number = container.querySelectorAll(".set").length+1;

 const row = document.createElement("div");
 row.className="set";

 row.innerHTML=`
 <span class="muted">${number}</span>
 <input type="number" min="0" step="0.25"
 class="weight" placeholder="Weight kg">
 <input type="number" min="0" step="1"
 class="reps" placeholder="Reps">
 <button type="button" class="danger removeSet">×</button>
 `;

 row.querySelector(".removeSet").addEventListener("click",()=>{
  row.remove();
  [...container.querySelectorAll(".set")].forEach((r,i)=>{
   r.firstElementChild.textContent=i+1;
  });
 });

 container.appendChild(row);
}

function addExercise(){
 exerciseCount++;

 const card=document.createElement("div");
 card.className="exercise";

 card.innerHTML=`
 <h3>Exercise ${exerciseCount}</h3>
 <label>Exercise Name</label>
 <input class="exerciseName" placeholder="Example: Hammer Curl">
 <div class="sets"></div>
 <button type="button" class="secondary addSet">+ Add Set</button>
 <button type="button" class="danger removeExercise">Remove</button>
 `;

 const sets=card.querySelector(".sets");

 card.querySelector(".addSet").addEventListener("click",()=>{
  addSet(sets);
 });

 card.querySelector(".removeExercise").addEventListener("click",()=>{
  card.remove();
 });

 addSet(sets);
 $("exerciseList").appendChild(card);
}

function collectExercises(){
 return [...document.querySelectorAll(".exercise")].map(card=>({
  name:card.querySelector(".exerciseName").value.trim(),
  sets:[...card.querySelectorAll(".set")].map(row=>({
   weight:row.querySelector(".weight").value,
   reps:row.querySelector(".reps").value
  })).filter(set=>set.weight!=="" || set.reps!=="")
 })).filter(ex=>ex.name);
}

function saveWorkout(){
 const exercises=collectExercises();

 if(!$("workoutDate").value){
  alert("Date select kijiye.");
  return;
 }

 if(!exercises.length){
  alert("Exercise ka naam add kijiye.");
  return;
 }

 if(exercises.some(ex=>!ex.sets.length)){
  alert("Har exercise mein kam se kam ek set ka weight ya reps bhariye.");
  return;
 }

 const workout={
  id:Date.now().toString()+"-"+Math.random().toString(36).slice(2),
  date:$("workoutDate").value,
  muscle:$("muscle").value,
  title:$("workoutTitle").value.trim(),
  notes:$("notes").value.trim(),
  exercises:exercises
 };

 workouts.unshift(workout);

 if(saveData()){
  alert("Workout successfully saved!");
  $("workoutTitle").value="";
  $("notes").value="";
  $("exerciseList").innerHTML="";
  exerciseCount=0;
  addExercise();
 }
}

function showSection(name){
 $("logSection").classList.toggle("hidden",name!=="log");
 $("historySection").classList.toggle("hidden",name!=="history");
 $("progressSection").classList.toggle("hidden",name!=="progress");

 $("logTab").classList.toggle("active",name==="log");
 $("historyTab").classList.toggle("active",name==="history");
 $("progressTab").classList.toggle("active",name==="progress");

 if(name==="history") renderHistory();
 if(name==="progress") renderProgress();
}

function formatDate(date){
 const d=new Date(date+"T12:00:00");
 return d.toLocaleDateString("en-IN",{
  day:"numeric",month:"short",year:"numeric"
 });
}

function renderHistory(){
 const host=$("historyList");
 host.innerHTML="";

 if(!workouts.length){
  host.textContent="No workouts saved yet.";
  return;
 }

 workouts.forEach(workout=>{
  const card=document.createElement("div");
  card.className="record";

  const exerciseHTML=workout.exercises.map(ex=>`
   <li>
    <b>${escapeHTML(ex.name)}</b><br>
    ${ex.sets.map(set=>
     `${escapeHTML(set.weight || "—")} kg × ${escapeHTML(set.reps || "—")} reps`
    ).join(" | ")}
   </li>
  `).join("");

  card.innerHTML=`
   <h3>${escapeHTML(workout.title || workout.muscle)}</h3>
   <div class="muted">${formatDate(workout.date)} · ${escapeHTML(workout.muscle)}</div>
   <ul>${exerciseHTML}</ul>
   ${workout.notes ? `<p class="muted">${escapeHTML(workout.notes)}</p>` : ""}
   <button class="danger deleteWorkout">Delete</button>
  `;

  card.querySelector(".deleteWorkout").addEventListener("click",()=>{
   if(confirm("Delete this workout?")){
    workouts=workouts.filter(w=>w.id!==workout.id);
    if(saveData()) renderHistory();
   }
  });

  host.appendChild(card);
 });
}

function renderProgress(){
 const query=$("progressSearch").value.trim().toLowerCase();
 const host=$("progressResult");

 if(!query){
  host.textContent="Exercise name type kijiye.";
  return;
 }

 const records=[];

 workouts.forEach(workout=>{
  workout.exercises.forEach(ex=>{
   if(ex.name.toLowerCase()===query){
    ex.sets.forEach(set=>{
     if(set.weight!==""){
      records.push({
       date:workout.date,
       weight:Number(set.weight),
       reps:set.reps
      });
     }
    });
   }
  });
 });

 records.sort((a,b)=>a.date.localeCompare(b.date));

 if(!records.length){
  host.textContent="Is exercise ka record nahi mila.";
  return;
 }

 const maximum=Math.max(...records.map(r=>r.weight));

 host.innerHTML=`
 <h3>Heaviest Weight: ${maximum} kg</h3>
 <p>${records.length} recorded sets</p>
 `;

 records.slice().reverse().forEach(record=>{
  const p=document.createElement("p");
  p.textContent=`${formatDate(record.date)} — ${record.weight} kg × ${record.reps || "—"} reps`;
  host.appendChild(p);
 });
}

$("addExercise").addEventListener("click",addExercise);
$("saveWorkout").addEventListener("click",saveWorkout);

$("logTab").addEventListener("click",()=>showSection("log"));
$("historyTab").addEventListener("click",()=>showSection("history"));
$("progressTab").addEventListener("click",()=>showSection("progress"));

$("progressSearch").addEventListener("input",renderProgress);

$("backupButton").addEventListener("click",()=>{
 const blob=new Blob(
  [JSON.stringify({workouts},null,2)],
  {type:"application/json"}
 );
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;
 a.download="gymsaathi-backup.json";
 a.click();
 URL.revokeObjectURL(url);
});

$("restoreFile").addEventListener("change",async event=>{
 const file=event.target.files[0];
 if(!file)return;

 try{
  const backup=JSON.parse(await file.text());
  const incoming=Array.isArray(backup)?backup:backup.workouts;

  if(!Array.isArray(incoming)) throw new Error("Invalid backup");

  if(confirm("Backup records restore karne hain?")){
   workouts=incoming.concat(workouts);
   if(saveData()){
    alert("Backup restored successfully!");
    renderHistory();
   }
  }
 }catch(error){
  alert("Invalid backup file.");
 }

 event.target.value="";
});

loadData();
addExercise();

if("serviceWorker" in navigator){
 window.addEventListener("load",()=>{
  navigator.serviceWorker.register("./sw.js")
   .then(()=>console.log("GymSaathi offline support ready"))
   .catch(error=>console.error("Service Worker:",error));
 });
}
</script>

</body>
</html>
